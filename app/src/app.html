<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />
        <meta name="theme-color" content="#14161b" />
        <!-- The theme before the first paint, from the copy src/lib/settings/theme.ts keeps (CTX-1.8). -->
        <script>
            try {
                var theme = localStorage.getItem('fretdex-theme');
                if (theme === 'light' || theme === 'contrast') document.documentElement.dataset.theme = theme;
            } catch (e) {}
        </script>
        <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
