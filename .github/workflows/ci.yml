name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on main from the Actions tab, to deploy again without a new merge.
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Format, lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (run 'npm run format' in the repository root to fix)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app's component tests run in a real Chromium
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: Run unit tests (fretkit, audio, app)
        run: npm test

  smoke:
    name: Smoke tests on phone viewports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: app

      - name: Build the app and run the Playwright tests
        run: npm run test:e2e

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: app/test-results/
          retention-days: 7

  # Each push to main that passes every check above deploys to GitHub Pages (fretdex.seannormoyle.net),
  # in two jobs: one builds and uploads the site, the next deploys it. Deploying in the same job as the
  # upload can ask for the artifact before GitHub lists it ("No artifacts named github-pages"); starting
  # a new job gives it time to appear.
  build-pages:
    name: Build the site for GitHub Pages
    needs: [static, unit, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the repository's Pages settings
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
